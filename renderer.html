<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Buddy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      overflow: hidden;
      width: 160px;
      height: 220px;
      position: relative;
      user-select: none;
      -webkit-app-region: no-drag;
      cursor: default;
    }
    canvas {
      display: block;
      width: 160px;
      height: 220px;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="320" height="440"></canvas>
  <div id="ctxmenu" style="display:none;position:absolute;top:0;left:0;background:rgba(40,40,50,0.95);border-radius:8px;padding:4px 0;box-shadow:0 4px 16px rgba(0,0,0,0.3);z-index:10;min-width:140px;font-family:'Segoe UI',Arial,sans-serif;font-size:13px;color:#eee;backdrop-filter:blur(8px);">
    <div id="ctxrestart" class="ctxitem" style="padding:8px 18px;cursor:default;">🔄 Reiniciar</div>
    <div id="ctxclose" class="ctxitem" style="padding:8px 18px;cursor:default;">✕ Cerrar</div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
